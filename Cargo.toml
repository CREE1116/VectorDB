[workspace]
members = [
    "crates/vectordb-core",
    "crates/vectordb-parser",
    "crates/vectordb-server",
    "crates/vectordb-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["VectorDB Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
tokio = { version = "1.38", features = ["full"] }
bincode = "1.3"
regex = "1.10"
walkdir = "2.5"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
notify = "8.2"
